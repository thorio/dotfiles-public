---
# xmonad-based desktop environment

- name: desktop
  gather_facts: false
  hosts: all
  tasks:
    - name: install packages
      become: true
      pacman:
        pkg:
          - xorg-server
          - xorg-xinit
          - xorg-xinput
          - xorg-xmessage
          - xorg-xrandr
          - xorg-xsetroot
          - arandr
          - autorandr
          - xmonad
          - xmonad-contrib
          - haskell-regex
          - xmobar
          - dmenu
          - slock
          - feh
          - picom
          - trayer
          - dunst
          - alacritty
          - flameshot
          - xss-lock
          - redshift
          - fuse2 # for appimages
          - noto-fonts
          - noto-fonts-emoji
          - ttf-hack-nerd
          - materia-gtk-theme
          - kvantum # theme engine so qt can use materia
          - kvantum-theme-materia

    - name: install AUR packages
      become: true
      aura:
        pkg:
          - espanso-x11-bin
          - ttf-ms-fonts
          - sunset-cursors-git
          - gravel-bin
          - rism-bin
